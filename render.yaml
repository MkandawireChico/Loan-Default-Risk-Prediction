services:
  - type: web
    name: nyanja-credit-risk-api
    runtime: docker
    plan: 1c-2g
    region: frankfurt
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nyanja-credit-risk-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://nyanja-credit-risk-ui.onrender.com

  - type: web
    name: nyanja-credit-risk-ui
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://nyanja-credit-risk-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: nyanja-credit-risk-db
    databaseName: nyanja_credit_risk
    user: nyanja
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
