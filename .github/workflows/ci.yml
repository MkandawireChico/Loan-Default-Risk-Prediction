name: CI

on:
  push:
    branches: [main, master, feature/credit-risk-platform]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt pytest pytest-cov ruff
      - name: Lint new platform modules
        run: |
          ruff check api migrations src/models/schema.py src/monitoring scripts/train_model_v2.py scripts/run_temporal_validation.py scripts/smoke_test.py tests/test_api.py tests/test_model_governance.py tests/test_drift_monitoring.py tests/test_migrations.py tests/test_deployment_config.py tests/test_temporal_validation.py
      - name: Run automated tests
        run: pytest tests/ --cov=src --cov-report=xml
      - name: Execute synthetic chronological experiment
        run: |
          python scripts/run_temporal_validation.py --output-dir /tmp/temporal-validation-smoke
          python -c "import json; p=json.load(open('/tmp/temporal-validation-smoke/temporal_validation_report.json')); assert p['partitions']['train']['end'] < p['partitions']['validation']['start']; assert p['partitions']['validation']['end'] < p['partitions']['test']['start']; assert len(p['model_comparison']['calibrated_logistic_regression']['monthly_future_test_diagnostics']) >= 5; assert {'prior_baseline', 'calibrated_logistic_regression', 'calibrated_random_forest'} <= set(p['model_comparison'])"

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Build production frontend
        working-directory: frontend
        run: npm run build

  container-smoke:
    needs: [quality, frontend-build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure local environment
        run: cp .env.example .env
      - name: Build full Docker Compose stack
        run: docker compose build
      - name: Start services
        run: docker compose up -d
      - name: Wait for API readiness
        run: |
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://localhost:8000/health >/tmp/health.json; then
              cat /tmp/health.json
              if grep -q '"status":"ok"' /tmp/health.json; then exit 0; fi
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs api db
          exit 1
      - name: Exercise API workflows
        run: python scripts/smoke_test.py
      - name: Verify frontend delivery
        run: curl --fail --silent --show-error http://localhost:8080/ | grep -q "Nyanja Credit Risk Intelligence"
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs api db web
      - name: Stop services
        if: always()
        run: docker compose down -v
